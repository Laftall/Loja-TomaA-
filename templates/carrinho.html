<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrinho</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    margin:0;
}

header {
    background:#111;
    color:white;
    padding:15px;
    text-align:center;
}

.container {
    padding:20px;
}

.item {
    background:white;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:15px;
    border-radius:10px;
}

.item img {
    width:100px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.btn {
    padding:8px;
    border:none;
    background:#ff9800;
    color:white;
    border-radius:6px;
    cursor:pointer;
    margin:2px;
}
</style>
</head>

<body>

<header>
    <h1>Carrinho 🛒</h1>
</header>

<div class="container">

{% for i in itens %}
<div class="item">

    <img src="{{ i.img if i.img is defined else '' }}">

    <div style="flex:1;">
        <h3>{{ i.nome }}</h3>
        <p>Preço: R$ {{ i.preco }}</p>
        <p>Subtotal: R$ {{ i.subtotal }}</p>
    </div>

    <div>
        <a href="/remove_one/{{ i.id }}"><button class="btn">-</button></a>
        <strong>{{ i.qtd }}</strong>
        <a href="/add_one/{{ i.id }}"><button class="btn">+</button></a>
    </div>

</div>
{% endfor %}

<h2>Total: R$ {{ total }}</h2>

<!-- BOTÃO FINALIZAR COMPRA (SÓ APARECE COM ITENS) -->
{% if itens|length > 0 %}
    <a href="/finalizar">
        <button class="btn">Finalizar Compra</button>
    </a>
{% endif %}

<a href="/home">
    <button class="btn">Voltar</button>
</a>

</div>

</body>
</html>
