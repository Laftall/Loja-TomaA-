<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Carrinho</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    margin:0;
}

header {
    background:#111;
    color:white;
    padding:15px;
    text-align:center;
}

.container {
    padding:20px;
}

.item {
    background:white;
    padding:15px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:15px;
    border-radius:10px;
}

.item img {
    width:100px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.btn {
    padding:8px;
    border:none;
    background:#ff9800;
    color:white;
    border-radius:6px;
    cursor:pointer;
    margin:2px;
}

.btn:hover {
    background: #e68900;
}

.empty {
    text-align:center;
    padding:40px;
    color:#777;
}
</style>
</head>

<body>

<header>
    <h1>Carrinho 🛒</h1>
</header>

<div class="container">

{% if not itens %}
    <div class="empty">
        <h2>Seu carrinho está vazio 🛒</h2>
        <a href="/home">
            <button class="btn">Voltar às compras</button>
        </a>
    </div>
{% endif %}

{% for i in itens %}
<div class="item">

    <img src="{{ i.img if i.img is defined else '' }}">

    <div style="flex:1;">
        <h3>{{ i.nome }}</h3>
        <p>Preço: R$ {{ "%.2f"|format(i.preco) }}</p>
        <p>Subtotal: R$ {{ "%.2f"|format(i.subtotal) }}</p>
    </div>

    <div>
        <a href="/remove_one/{{ i.id }}">
            <button class="btn">-</button>
        </a>

        <strong>{{ i.qtd }}</strong>

        <a href="/add_one/{{ i.id }}">
            <button class="btn">+</button>
        </a>
    </div>

</div>
{% endfor %}

{% if itens %}

<h2>Total: R$ {{ "%.2f"|format(total) }}</h2>

<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">

    <div style="display:flex; gap:10px;">
        <a href="/home">
            <button class="btn">Continuar comprando</button>
        </a>

        <a href="/finalizar">
            <button class="btn">Finalizar Compra</button>
        </a>
    </div>

    <a href="/limpar_carrinho">
        <button class="btn" style="background:red;">
            Limpar Carrinho
        </button>
    </a>

</div>

{% endif %}

</div>

</body>
</html>
