<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box{
      background: white;
      width: 350px;

      padding: 30px;
      border-radius: 15px;

      box-shadow: 0 10px 25px rgba(0,0,0,0.2);

      text-align: center;
    }

    .box h2{
      margin-bottom: 25px;
      color: #000;
    }

    .input-group{
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label{
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .input-group input{
      width: 100%;
      padding: 12px;

      border: 1px solid #ccc;
      border-radius: 8px;

      outline: none;
      font-size: 14px;
    }

    .input-group input:focus{
      border-color: #4facfe;
    }

    button{
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 8px;

      background: #4facfe;
      color: white;

      font-size: 16px;
      cursor: pointer;

      transition: 0.3s;
    }

    button:hover{
      background: #2196f3;
    }

    .login-link{
      margin-top: 18px;
    }

    .login-link a{
      color: #6a1b9a;
      text-decoration: none;
    }

    .login-link a:hover{
      text-decoration: underline;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Cadastro</h2>

    <form action="/cadastrar" method="POST">

      <div class="input-group">
        <label>Email</label>

        <input 
          type="email" 
          name="email" 
          placeholder="Digite seu email"
          required
        >
      </div>

      <div class="input-group">
        <label>Senha</label>

        <input 
          type="password" 
          name="password" 
          placeholder="Digite sua senha"
          required
        >
      </div>

      <button type="submit">
        Cadastrar
      </button>

    </form>

    <div class="login-link">
      <p>
        Já possui conta?
        <a href="/">Voltar para login</a>
      </p>
    </div>

  </div>

</body>
</html>
