<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Catálogo</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    margin:0;
}

header {
    background:#111;
    color:white;
    padding:15px;
    text-align:center;
}

.container {
    padding:20px;
}

.card {
    background:white;
    padding:15px;
    margin:10px;
    display:inline-block;
    width:200px;
    border-radius:10px;
    text-align:center;
}

.card img {
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

.btn {
    padding:8px;
    background:#ff9800;
    border:none;
    color:white;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
    <h1>Catálogo: {{ categoria }}</h1>
</header>

<div class="container">

{% for p in produtos %}
<div class="card">

    <img src="{{ p.img }}">
    <h3>{{ p.nome }}</h3>
    <p>R$ {{ p.preco }}</p>

    <a href="/add/{{ p.id }}/{{ p.nome }}/{{ p.preco }}">
        <button class="btn">Adicionar</button>
    </a>

    

</div>
{% endfor %}

<br><br>

<a href="/home"><button class="btn">Voltar</button></a>
<a href="/carrinho"><button class="btn">Ir para carrinho</button></a>

</div>

</body>
</html>
