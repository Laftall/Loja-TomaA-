<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Checkout</title>

<style>
body {
    font-family: Arial;
    background: #f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box {
    background:white;
    padding:40px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1 {
    color: green;
}

.btn {
    margin-top:20px;
    padding:10px;
    border:none;
    background:#ff9800;
    color:white;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="box">

    <h1>Obrigado pela sua compra 🎉</h1>

    <p>
        As informações do pedido serão encaminhadas para o seu e-mail.<br>
        Volte sempre!
    </p>

    <a href="/home">
        <button class="btn">Voltar à loja</button>
    </a>

</div>

</body>
</html>
